<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فاست كاش - نظام إدارة الحوالات والصرافة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
  </style>
</head>
<body class="bg-slate-100">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
    import { getFirestore, collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    const { useState, useEffect, useMemo } = React;

    // --- Firebase Cloud Initialization ---
    const firebaseConfig = {
      apiKey: "AIzaSyDK6CFYl4hw2t6MuAs2_H4-Rws9rPiNvVY",
      authDomain: "fast-cash-7b9c4.firebaseapp.com",
      projectId: "fast-cash-7b9c4",
      storageBucket: "fast-cash-7b9c4.firebasestorage.app",
      messagingSenderId: "859546803127",
      appId: "1:859546803127:web:0aeb06e41e780d8f3e6632",
      measurementId: "G-2HKFEWH722"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = 'fast-cash-7b9c4';

    const getCloudCollection = (collName) => collection(db, 'artifacts', appId, 'public', 'data', collName);
    const getCloudDoc = (collName, docId) => doc(db, 'artifacts', appId, 'public', 'data', collName, docId);

    // --- Clean SVG Icons ---
    const IconTrendingUp = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
      </svg>
    );

    const IconWallet = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
      </svg>
    );

    const IconUsers = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
    );

    const IconPlusCircle = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );

    const IconSearch = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    );

    const IconRefreshCw = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
    );

    const IconGlobe = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
      </svg>
    );

    const IconCheckCircle2 = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );

    const IconXCircle = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );

    const IconArrowLeftRight = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
      </svg>
    );

    const IconDownload = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
      </svg>
    );

    const IconExchange = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
    );

    const IconShield = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
      </svg>
    );

    const IconSettings = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
        <path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
    );

    const IconLogOut = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
    );

    const IconLock = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
      </svg>
    );

    const IconDatabase = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" />
      </svg>
    );

    function App() {
      const [user, setUser] = useState(null);
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('fastcash_current_user');
        return saved ? JSON.parse(saved) : null;
      });

      const [loginForm, setLoginForm] = useState({ username: '', password: '' });
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [isLoggingIn, setIsLoggingIn] = useState(false);

      useEffect(() => {
        const initAuth = async () => {
          try {
            await signInAnonymously(auth);
          } catch (err) {
            console.error("Auth init error:", err);
          }
        };
        initAuth();
        const unsubscribe = onAuthStateChanged(auth, setUser);
        return () => unsubscribe();
      }, []);

      const [characterState, setCharacterState] = useState('idle');
      const [mousePos, setMousePos] = useState({ x: 0, y: 0 });

      useEffect(() => {
        const handleMouseMove = (e) => {
          setMousePos({ x: e.clientX, y: e.clientY });
        };
        window.addEventListener('mousemove', handleMouseMove);
        return () => window.removeEventListener('mousemove', handleMouseMove);
      }, []);

      const [activeTab, setActiveTab] = useState('dashboard');
      const [toast, setToast] = useState(null);

      const [sysSettings, setSysSettings] = useState({
        appName: 'فاست كاش',
        subTitle: 'نظام إدارة الحوالات والصرافة المتقدم',
        logoText: 'FC',
        defaultCurrency: 'USDT'
      });

      const [users, setUsers] = useState([]);
      const [wallets, setWallets] = useState([]);
      const [suppliers, setSuppliers] = useState([]);
      const [transactions, setTransactions] = useState([]);

      useEffect(() => {
        if (!user) return;

        const unsubSettings = onSnapshot(getCloudCollection('settings'), (snapshot) => {
          if (!snapshot.empty) {
            setSysSettings(snapshot.docs[0].data());
          } else {
            const defaultSettings = {
              appName: 'فاست كاش',
              subTitle: 'نظام إدارة الحوالات والصرافة المتقدم',
              logoText: 'FC',
              defaultCurrency: 'USDT'
            };
            setDoc(getCloudDoc('settings', 'config'), defaultSettings);
          }
        });

        const unsubUsers = onSnapshot(getCloudCollection('users'), (snapshot) => {
          if (!snapshot.empty) {
            setUsers(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          } else {
            const defaultAdmin = { id: 'u-1', name: 'المدير الرئيسي', username: 'admin', password: 'admin123', role: 'admin', status: 'نشط', lastActive: 'الآن' };
            setDoc(getCloudDoc('users', 'u-1'), defaultAdmin);
          }
        });

        const unsubWallets = onSnapshot(getCloudCollection('wallets'), (snapshot) => {
          if (!snapshot.empty) {
            setWallets(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          } else {
            const initialWallets = [
              { id: 'w-1', name: 'محفظة Binance الرئيسية (USDT)', currency: 'USDT', balance: 12500, owner: 'المكتب' },
              { id: 'w-2', name: 'حساب بنك فلسطين (أحمد رياض - شيكل)', currency: 'ILS', balance: 45000, owner: 'أحمد رياض' },
              { id: 'w-3', name: 'خزينة المحل الكاش (دولار)', currency: 'USD', balance: 3200, owner: 'خزينة المحل' },
              { id: 'w-4', name: 'حساب بنك مصر (فودافون كاش - جنيه)', currency: 'EGP', balance: 150000, owner: 'مورد مصر' }
            ];
            initialWallets.forEach(w => setDoc(getCloudDoc('wallets', w.id), w));
          }
        });

        const unsubSuppliers = onSnapshot(getCloudCollection('suppliers'), (snapshot) => {
          if (!snapshot.empty) {
            setSuppliers(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          } else {
            const initialSuppliers = [
              { id: 's-1', name: 'مورد مصر (مركزي)', country: 'مصر', defaultCurrency: 'EGP', pendingUsdt: 1200, wallets: ['Vodafone 01012345678', 'Banque Misr 99201'], phone: '+201012345678' },
              { id: 's-2', name: 'مورد تركيا (سريع)', country: 'تركيا', defaultCurrency: 'USD', pendingUsdt: 0, wallets: ['TRX-Turk-881920'], phone: '+90551234567' },
              { id: 's-3', name: 'مورد PayPal العالمي', country: 'عالمي', defaultCurrency: 'USD', pendingUsdt: 450, wallets: ['pay@fastcash.com'], phone: '-' }
            ];
            initialSuppliers.forEach(s => setDoc(getCloudDoc('suppliers', s.id), s));
          }
        });

        const unsubTxs = onSnapshot(getCloudCollection('transactions'), (snapshot) => {
          const list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          list.sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
          setTransactions(list);
        });

        return () => {
          unsubSettings();
          unsubUsers();
          unsubWallets();
          unsubSuppliers();
          unsubTxs();
        };
      }, [user]);

      const [rates, setRates] = useState({ USD_ILS: 3.70, USDT_ILS: 3.72, USD_EGP: 49.50 });
      const [isLoadingRates, setIsLoadingRates] = useState(false);

      const [searchTerm, setSearchTerm] = useState('');
      const [dateFilterType, setDateFilterType] = useState('all');

      const [isAddTxOpen, setIsAddTxOpen] = useState(false);
      const [isAddWalletOpen, setIsAddWalletOpen] = useState(false);
      const [editingWallet, setEditingWallet] = useState(null);
      const [isAddSupplierOpen, setIsAddSupplierOpen] = useState(false);
      const [editingSupplier, setEditingSupplier] = useState(null);
      const [isInternalTransferOpen, setIsInternalTransferOpen] = useState(false);
      const [isAddUserOpen, setIsAddUserOpen] = useState(false);

      const [walletForm, setWalletForm] = useState({ name: '', currency: 'ILS', balance: '', owner: '' });
      const [supplierForm, setSupplierForm] = useState({ name: '', country: 'مصر', defaultCurrency: 'EGP', walletsText: '', phone: '' });
      const [userForm, setUserForm] = useState({ name: '', username: '', password: '', role: 'staff' });
      const [transferForm, setTransferForm] = useState({ fromWalletId: 'w-1', toWalletId: 'w-2', amount: '', rate: '1' });
      const [newTx, setNewTx] = useState({
        clientName: '',
        supplierId: 's-1',
        supplierWallet: '',
        inflowUsdt: '',
        isUsdtReceived: true,
        inflowUsdtWalletId: 'w-1',
        outflowAmount: '',
        outflowWalletId: 'w-2',
        exchangeRate: '3.70',
        notes: ''
      });

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      const fetchLiveRates = () => {
        setIsLoadingRates(true);
        setTimeout(() => {
          setRates({ USD_ILS: 3.71, USDT_ILS: 3.73, USD_EGP: 49.80 });
          setIsLoadingRates(false);
          showToast('تم تحديث أسعار العملات المباشرة 🔄');
        }, 600);
      };

      const capitalSummary = useMemo(() => {
        let totalUsdt = 0, totalIls = 0, totalUsd = 0, totalEgp = 0;
        wallets.forEach(w => {
          const bal = parseFloat(w.balance) || 0;
          if (w.currency === 'USDT') totalUsdt += bal;
          if (w.currency === 'ILS') totalIls += bal;
          if (w.currency === 'USD') totalUsd += bal;
          if (w.currency === 'EGP') totalEgp += bal;
        });

        const ilsInUsdt = rates.USDT_ILS ? totalIls / rates.USDT_ILS : 0;
        const usdInUsdt = totalUsd;
        const egpInUsdt = (rates.USD_EGP && rates.USDT_ILS) ? totalEgp / rates.USD_EGP : 0;
        const totalCapitalUsdt = totalUsdt + ilsInUsdt + usdInUsdt + egpInUsdt;

        return { totalUsdt, totalIls, totalUsd, totalEgp, totalCapitalUsdt: Math.round(totalCapitalUsdt * 100) / 100 };
      }, [wallets, rates]);

      const filteredTransactions = useMemo(() => {
        return transactions.filter(tx => {
          const matchSearch = tx.clientName?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                              tx.notes?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                              tx.id?.toLowerCase().includes(searchTerm.toLowerCase());
          if (!matchSearch) return false;
          const today = new Date().toISOString().split('T')[0];
          if (dateFilterType === 'today') return tx.date === today;
          return true;
        });
      }, [transactions, searchTerm, dateFilterType]);

      const handleSaveWallet = async (e) => {
        e.preventDefault();
        if (!user) return;
        try {
          if (editingWallet) {
            await updateDoc(getCloudDoc('wallets', editingWallet.id), {
              name: walletForm.name,
              currency: walletForm.currency,
              balance: parseFloat(walletForm.balance) || 0,
              owner: walletForm.owner
            });
            showToast('تم تحديث المحفظة في السحاب ✅');
          } else {
            const wId = `w-${Date.now()}`;
            await setDoc(getCloudDoc('wallets', wId), {
              id: wId,
              name: walletForm.name,
              currency: walletForm.currency,
              balance: parseFloat(walletForm.balance) || 0,
              owner: walletForm.owner
            });
            showToast('تم حفظ المحفظة في السحاب بنجاح ☁️');
          }
          setIsAddWalletOpen(false);
        } catch (err) {
          showToast('خطأ في الاتصال بقاعدة البيانات السحابية', 'error');
        }
      };

      const handleDeleteWallet = async (id) => {
        if (!user) return;
        if (wallets.length <= 1) return showToast('لا يمكن حذف المحفظة الوحيدة', 'error');
        try {
          await deleteDoc(getCloudDoc('wallets', id));
          showToast('تم حذف المحفظة من السحاب');
        } catch (err) {
          showToast('تعذر الحذف من السحاب', 'error');
        }
      };

      const handleSaveSupplier = async (e) => {
        e.preventDefault();
        if (!user) return;
        const wList = supplierForm.walletsText.split('\n').map(x => x.trim()).filter(Boolean);
        try {
          if (editingSupplier) {
            await updateDoc(getCloudDoc('suppliers', editingSupplier.id), {
              name: supplierForm.name,
              country: supplierForm.country,
              defaultCurrency: supplierForm.defaultCurrency,
              wallets: wList,
              phone: supplierForm.phone
            });
            showToast('تم تحديث بيانات المورد سحابياً');
          } else {
            const sId = `s-${Date.now()}`;
            await setDoc(getCloudDoc('suppliers', sId), {
              id: sId,
              name: supplierForm.name,
              country: supplierForm.country,
              defaultCurrency: supplierForm.defaultCurrency,
              pendingUsdt: 0,
              wallets: wList,
              phone: supplierForm.phone
            });
            showToast('تم حفظ المورد في السحاب');
          }
          setIsAddSupplierOpen(false);
        } catch (err) {
          showToast('خطأ في حفظ بيانات المورد', 'error');
        }
      };

      const handleDeleteSupplier = async (id) => {
        if (!user) return;
        try {
          await deleteDoc(getCloudDoc('suppliers', id));
          showToast('تم حذف المورد من السحاب');
        } catch (err) {
          showToast('تعذر حذف المورد', 'error');
        }
      };

      const handleInternalTransfer = async (e) => {
        e.preventDefault();
        if (!user) return;
        const amt = parseFloat(transferForm.amount) || 0;
        if (amt <= 0) return showToast('يرجى إدخال مبلغ صحيح', 'error');

        const fromW = wallets.find(w => w.id === transferForm.fromWalletId);
        const toW = wallets.find(w => w.id === transferForm.toWalletId);
        if (!fromW || !toW) return;
        if (fromW.balance < amt) return showToast('رصيد المحفظة المصدر غير كافٍ', 'error');

        const rate = parseFloat(transferForm.rate) || 1;
        const targetAmt = amt * rate;

        try {
          await updateDoc(getCloudDoc('wallets', fromW.id), { balance: fromW.balance - amt });
          await updateDoc(getCloudDoc('wallets', toW.id), { balance: toW.balance + targetAmt });
          showToast(`تم التحويل السحابي بنجاح: ${amt} ${fromW.currency} → ${targetAmt} ${toW.currency}`);
          setIsInternalTransferOpen(false);
        } catch (err) {
          showToast('فشل تنفيذ التحويل في السحاب', 'error');
        }
      };

      const handleAddUser = async (e) => {
        e.preventDefault();
        if (!user) return;
        if (!userForm.password) return showToast('يرجى تحديد كلمة مرور للمستخدم الجديد!', 'error');
        const uId = `u-${Date.now()}`;
        try {
          await setDoc(getCloudDoc('users', uId), {
            id: uId,
            name: userForm.name,
            username: userForm.username,
            password: userForm.password,
            role: userForm.role,
            status: 'نشط',
            lastActive: 'الآن'
          });
          showToast('تم حفظ المستخدم الجديد في السحاب ✅');
          setIsAddUserOpen(false);
          setUserForm({ name: '', username: '', password: '', role: 'staff' });
        } catch (err) {
          showToast('خطأ في حفظ حساب المستخدم', 'error');
        }
      };

      const handleAddTransaction = async (e) => {
        e.preventDefault();
        if (!user) return;

        const inflow = parseFloat(newTx.inflowUsdt) || 0;
        const outflow = parseFloat(newTx.outflowAmount) || 0;
        const outflowWallet = wallets.find(w => w.id === newTx.outflowWalletId);

        if (outflow > 0 && outflowWallet && outflowWallet.balance < outflow) {
          return showToast(`رصيد المحفظة (${outflowWallet.name}) غير كافٍ لتسليم العميل!`, 'error');
        }

        try {
          if (outflow > 0 && outflowWallet) {
            await updateDoc(getCloudDoc('wallets', outflowWallet.id), {
              balance: outflowWallet.balance - outflow
            });
          }

          if (newTx.isUsdtReceived && inflow > 0) {
            const inflowW = wallets.find(w => w.id === newTx.inflowUsdtWalletId);
            if (inflowW) {
              await updateDoc(getCloudDoc('wallets', inflowW.id), {
                balance: inflowW.balance + inflow
              });
            }
          }

          if (!newTx.isUsdtReceived && inflow > 0) {
            const sup = suppliers.find(s => s.id === newTx.supplierId);
            if (sup) {
              await updateDoc(getCloudDoc('suppliers', sup.id), {
                pendingUsdt: (sup.pendingUsdt || 0) + inflow
              });
            }
          }

          const txId = `TX-${Math.floor(1000 + Math.random() * 9000)}`;
          await setDoc(getCloudDoc('transactions', txId), {
            id: txId,
            date: new Date().toISOString().split('T')[0],
            time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
            clientName: newTx.clientName,
            supplierId: newTx.supplierId,
            supplierWallet: newTx.supplierWallet,
            inflowUsdt: inflow,
            isUsdtReceived: newTx.isUsdtReceived,
            inflowUsdtWalletId: newTx.inflowUsdtWalletId,
            clientAmount: outflow,
            clientCurrency: outflowWallet ? outflowWallet.currency : 'ILS',
            outflowWalletId: newTx.outflowWalletId,
            outflowWalletName: outflowWallet ? outflowWallet.name : '',
            exchangeRate: newTx.exchangeRate,
            notes: newTx.notes
          });

          showToast('تم تسجيل وتأكيد الحوالة ومزامنتها سحابياً 🚀');
          setIsAddTxOpen(false);
          setNewTx({ ...newTx, clientName: '', inflowUsdt: '', outflowAmount: '', notes: '' });

          showToast('تعذر حفظ الحوالة في قاعدة البيانات', 'error');
        }

        const csvContent = 'data:text/csv;charset=utf-8,\uFEFF' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');

                        <label className="block text-xs font-bold text-emerald-900 mb-1">وارد الـ USDT من المورد</label>
                        <input type="number" step="any" placeholder="0.00" value={newTx.inflowUsdt} onChange={(e) => setNewTx({...newTx, inflowUsdt: e.target.value})} className="w-full px-3 py-2 bg-white border border-emerald-300 rounded-lg text-xs sm:text-sm font-mono font-bold text-emerald-800" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-emerald-900 mb-1">حالة استلام الـ USDT</label>
                        <select value={newTx.isUsdtReceived ? 'yes' : 'no'} onChange={(e) => setNewTx({...newTx, isUsdtReceived: e.target.value === 'yes'})} className="w-full px-3 py-2 bg-white border border-emerald-300 rounded-lg text-xs font-bold">
                          <option value="yes">تم استلام الـ USDT فوراً (إضافة للمحفظة)</option>
                          <option value="no">لم أستلم USDT الآن (تبقى معلقة عند المورد)</option>
                        </select>
                      </div>
                    </div>

                    {newTx.isUsdtReceived && (
                      <div>
                        <label className="block text-xs font-bold text-emerald-900 mb-1">تنسيب وتزويد رصيد الـ USDT في محفظة: *</label>
                        <select value={newTx.inflowUsdtWalletId} onChange={(e) => setNewTx({...newTx, inflowUsdtWalletId: e.target.value})} className="w-full px-3 py-2 bg-white border border-emerald-300 rounded-lg text-xs font-bold text-slate-800">
                          {wallets.filter(w => w.currency === 'USDT').map(w => (
                            <option key={w.id} value={w.id}>{w.name} (الرصيد: ${w.balance} USDT)</option>
                          ))}
                        </select>
                      </div>
                    )}
                  </div>

                  {/* Outflow / Client Delivery */}
                  <div className="bg-rose-50/70 p-3.5 sm:p-4 rounded-xl border border-rose-200 space-y-3">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-bold text-rose-900 mb-1">المبلغ المخصوم والمسلم للعميل *</label>
                        <input type="number" step="any" placeholder="350" value={newTx.outflowAmount} onChange={(e) => setNewTx({...newTx, outflowAmount: e.target.value})} className="w-full px-3 py-2 bg-white border border-rose-300 rounded-lg text-xs sm:text-sm font-mono font-bold text-rose-900" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-rose-900 mb-1">سعر الصرف للحوالة</label>
                        <input type="number" step="any" placeholder="3.70" value={newTx.exchangeRate} onChange={(e) => setNewTx({...newTx, exchangeRate: e.target.value})} className="w-full px-3 py-2 bg-white border border-rose-300 rounded-lg text-xs sm:text-sm font-mono text-slate-800" />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-rose-900 mb-1">خصم وتنزيل المبلغ المسلم من محفظة المكتب: *</label>
                      <select value={newTx.outflowWalletId} onChange={(e) => setNewTx({...newTx, outflowWalletId: e.target.value})} className="w-full px-3 py-2 bg-white border border-rose-300 rounded-lg text-xs font-bold text-slate-800">
                        {wallets.map(w => (
                          <option key={w.id} value={w.id}>{w.name} ({w.owner}) — الرصيد: {w.balance} {w.currency}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">ملاحظات الحوالة</label>
                    <textarea rows="2" placeholder="ملاحظات تفصيلية..." value={newTx.notes} onChange={(e) => setNewTx({...newTx, notes: e.target.value})} className="w-full px-3.5 py-2 bg-slate-50 border rounded-xl text-xs"></textarea>
                  </div>

                  <div className="pt-3 flex justify-end space-x-2 space-x-reverse shrink-0">
                    <button type="button" onClick={() => setIsAddTxOpen(false)} className="px-4 py-2 bg-slate-100 text-xs font-bold rounded-xl">إلغاء</button>
                    <button type="submit" className="px-5 py-2 bg-emerald-600 text-white text-xs font-bold rounded-xl">تأكيد وتسجيل الحوالة</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
